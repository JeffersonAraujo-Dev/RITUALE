spring:
  datasource:
    url: jdbc:h2:mem:rituale;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

server:
  port: 0

app:
  jwt:
    secret: test-secret-key-32-chars-minimum
    expiration-ms: 3600000
  whatsapp:
    phone: 5500000000000

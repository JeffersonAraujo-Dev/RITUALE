<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Criar conta — Rituale</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <a class="logo" href="index.html">Rituale</a>
      <h1>Criar sua conta</h1>
      <form id="registerForm">
        <input id="registerName" type="text" placeholder="Nome" required>
        <input id="registerEmail" type="email" placeholder="E-mail" required>
        <input id="registerPassword" type="password" placeholder="Senha" required>
        <button type="submit" class="button">Cadastrar</button>
      </form>
      <p>Já possui conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>

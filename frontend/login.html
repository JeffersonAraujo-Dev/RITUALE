<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Entrar — Rituale</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <a class="logo" href="index.html">Rituale</a>
      <h1>Bem-vindo de volta</h1>
      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="E-mail" required>
        <input id="loginPassword" type="password" placeholder="Senha" required>
        <button type="submit" class="button">Entrar</button>
      </form>
      <p>Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>

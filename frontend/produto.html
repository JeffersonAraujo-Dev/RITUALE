<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto — Rituale</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><a class="brand" href="index.html"><span class="moon"><svg viewBox="0 0 100 100"><defs><linearGradient id="gold"><stop stop-color="#fff2a8"/><stop offset=".5" stop-color="#c18b25"/><stop offset="1" stop-color="#fff0a0"/></linearGradient></defs><path fill="url(#gold)" d="M69 9c-4 19-19 31-37 35 12 17 31 27 51 23-8 15-23 25-40 25C19 92 0 73 0 49 0 26 17 7 39 4c11-1 21 1 30 5Z"/></svg></span>RITUALE</a><nav><a href="produtos.html">Coleção</a><a href="carrinho.html">Carrinho <b id="cartCount">0</b></a></nav></header><main class="page" id="detail"></main><script>
const API='http://localhost:8080/api/public/products';const slug=new URLSearchParams(location.search).get('slug');async function go(){const r=await fetch(API+'/'+encodeURIComponent(slug));if(!r.ok)throw Error();const p=await r.json();document.title=p.name+' — Rituale';document.querySelector('#detail').innerHTML='<span class="eyebrow">'+(p.category?.name||'RITUALE')+'</span><h1>'+p.name+'</h1><div class="detail-layout"><div class="detail-art"><div class="mini-bottle big"></div></div><div><p class="detail-desc">'+(p.description||'Uma fragrância selecionada pela Rituale.')+'</p><div class="price">R$ '+Number(p.price).toFixed(2).replace('.',',')+'</div><p>Estoque disponível: '+p.stock+'</p><button class="btn gold" onclick="add()">Adicionar ao carrinho</button></div></div>';window.p=p}function add(){let c=JSON.parse(localStorage.getItem('rituale_cart')||'[]'),i=c.findIndex(x=>x.id===p.id);if(i>=0)c[i].quantity++;else c.push({id:p.id,name:p.name,price:p.price,quantity:1,slug:p.slug});localStorage.setItem('rituale_cart',JSON.stringify(c));location.href='carrinho.html'}go().catch(()=>document.querySelector('#detail').innerHTML='<h1>Produto não encontrado</h1>');</script></body></html>
